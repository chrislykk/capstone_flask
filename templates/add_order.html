<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Order | HRS</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input, select { font-size: 1rem; padding: 0.4rem; width: 100%; box-sizing: border-box; margin-top: 0.25rem; }
    button { margin-top: 1.5rem; font-size: 1rem; padding: 0.5rem 1.25rem; }
    .hint { color: #666; font-size: 0.9rem; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Add an order</h1>
  <p><a href="{{ url_for('orders') }}">Back to orders</a></p>

  {% if error %}<p class="error">{{ error }}</p>{% endif %}

  <form method="post">
    <label for="customer_id">Customer</label>
    <select name="customer_id" id="customer_id" required>
      <option value="">Choose a customer</option>
      {% for c in customers %}
        <option value="{{ c.CustomerID }}" {% if form.get('customer_id') == c.CustomerID|string %}selected{% endif %}>
          {{ c.LastName }}, {{ c.FirstName }}
        </option>
      {% endfor %}
    </select>

    <label for="location_id">Branch</label>
    <select name="location_id" id="location_id" required>
      <option value="">Choose a branch</option>
      {% for loc in locations %}
        <option value="{{ loc.LocationID }}" {% if form.get('location_id') == loc.LocationID|string %}selected{% endif %}>
          {{ loc.LocationName }}
        </option>
      {% endfor %}
    </select>

    <label for="employee_id">Salesperson (optional)</label>
    <select name="employee_id" id="employee_id">
      <option value="">None</option>
      {% for e in employees %}
        <option value="{{ e.EmployeeID }}" {% if form.get('employee_id') == e.EmployeeID|string %}selected{% endif %}>
          {{ e.LastName }}, {{ e.FirstName }}
        </option>
      {% endfor %}
    </select>

    <label for="order_date">Order date</label>
    <input type="date" name="order_date" id="order_date" required value="{{ form.get('order_date', today) }}">

    <label for="tax_rate">Tax rate (%)</label>
    <input type="number" name="tax_rate" id="tax_rate" min="0" max="99" step="0.01" required value="{{ form.get('tax_rate', '6.5') }}">

    <label for="delivery_charge">Delivery charge</label>
    <input type="number" name="delivery_charge" id="delivery_charge" min="0" step="0.01" required value="{{ form.get('delivery_charge', '0.00') }}">

    <p class="hint">New orders start as Open. Add products on the next page.</p>
    <button type="submit">Create order</button>
  </form>
</body>
</html>
