<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Manage Products | HRS</title>
  <!-- paste the <style>...</style> block from customers.html here -->
    <style>
        body { font-family: system-ui, sans-serif; max-width: 64rem; margin: 2rem auto; padding: 0 1rem; color: #222; }
        h1 { font-size: 1.5rem; margin-bottom: 1rem; }
        input, button { font-size: 1rem; padding: 0.3rem 0.5rem; }
        .table-wrap { overflow-x: auto; }
        table { border-collapse: collapse; width: 100%; margin-top: 1.5rem; }
        th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid #ddd; white-space: nowrap; }
        th { background: #f2f4f7; }
        .count { color: #666; margin-top: 1.5rem; }
    </style>
</head>
<body>
  <h1>Manage Products</h1>
  <p><a href="{{ url_for('index') }}">Staff portal</a> | <a href="{{ url_for('add_products') }}">Add a product</a> | <a href="/logout">Log out</a></p></p>

  <table>
    <thead>
      <tr>
        <th>ID</th><th>Category</th><th>Brand</th><th>Description</th>
        <th>Model</th><th>Cost</th><th>List price</th>
      </tr>
    </thead>
    <tbody>
      {% for p in products %}
        <tr>
          <td>{{ p.ProductID }}</td>
          <td>{{ p.Category }}</td>
          <td>{{ p.Brand }}</td>
          <td>{{ p.ProductDescription }}</td>
          <td>{{ p.ModelNumber }}</td>
          <td>${{ "%.2f"|format(p.Cost) }}</td>
          <td>${{ "%.2f"|format(p.ListPrice) }}</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</body>
</html>
