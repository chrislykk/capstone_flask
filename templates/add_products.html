<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Products | HRS</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input, select { font-size: 1rem; padding: 0.4rem; width: 100%; box-sizing: border-box; margin-top: 0.25rem; }
    button { margin-top: 1.5rem; font-size: 1rem; padding: 0.5rem 1.25rem; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Add a product</h1>
  <p><a href="{{ url_for('products') }}">Back to products</a></p>

  {% if error %}<p class="error">{{ error }}</p>{% endif %}

  <form method="post">
    <label for="vendor_id">Vendor</label>
    <select name="vendor_id" id="vendor_id" required>
      <option value="">Choose a vendor</option>
      {% for v in vendors %}
        <option value="{{ v.VendorID }}" {% if form.get('vendor_id') == v.VendorID|string %}selected{% endif %}>
          {{ v.VendorName }}
        </option>
      {% endfor %}
    </select>
    
    <label for="model_number">Model number</label>
    <input type="text" name="model_number" id="model_number" maxlength="30" required value="{{ form.get('model_number', '') }}">

    <label for="brand">Brand</label>
    <input type="text" name="brand" id="brand" maxlength="50" required value="{{ form.get('brand', '') }}">

    <label for="product_description">Description</label>
    <input type="text" name="product_description" id="product_description" maxlength="255" required value="{{ form.get('product_description', '') }}">

    <label for="category">Category</label>
    <input type="text" name="category" id="category" maxlength="30" placeholder="Appliances" required value="{{ form.get('category', '') }}">

    <label for="cost">Cost</label>
    <input type="number" name="cost" id="cost" min="0" step="0.01" required value="{{ form.get('cost', '') }}">

    <label for="list_price">List price</label>
    <input type="number" name="list_price" id="list_price" min="0" step="0.01" required value="{{ form.get('list_price', '') }}">

    <button type="submit">Add product</button>
  </form>
</body>
</html>
