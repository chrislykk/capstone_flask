<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Employee | HRS</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; color: #222; }
    h1 { font-size: 1.5rem; margin-bottom: 1rem; }
    label { display: block; margin-top: 1rem; font-weight: 600; }
    input, select { font-size: 1rem; padding: 0.4rem; width: 100%; box-sizing: border-box; margin-top: 0.25rem; }
    button { margin-top: 1.5rem; font-size: 1rem; padding: 0.5rem 1.25rem; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>Add an employee</h1>
  <p><a href="{{ url_for('employees') }}">Back to employees</a></p>

  {% if error %}<p class="error">{{ error }}</p>{% endif %}

  <form method="post">
    <label for="location_id">Branch</label>
    <select name="location_id" id="location_id" required>
      <option value="">Choose a branch</option>
      {% for loc in locations %}
        <option value="{{ loc.LocationID }}" {% if form.get('location_id') == loc.LocationID|string %}selected{% endif %}>
          {{ loc.LocationName }}
        </option>
      {% endfor %}
    </select>

    <label for="first_name">First name</label>
    <input type="text" name="first_name" id="first_name" maxlength="50" required value="{{ form.get('first_name', '') }}">

    <label for="last_name">Last name</label>
    <input type="text" name="last_name" id="last_name" maxlength="50" required value="{{ form.get('last_name', '') }}">

    <label for="job_title">Job title</label>
    <input type="text" name="job_title" id="job_title" maxlength="50" required value="{{ form.get('job_title', '') }}">

    <label for="phone">Phone</label>
    <input type="tel" name="phone" id="phone" maxlength="20" placeholder="(602) 555-0123" required value="{{ form.get('phone', '') }}">

    <label for="email">Email</label>
    <input type="email" name="email" id="email" maxlength="100" placeholder="first.last@hrsremodeling.com" required value="{{ form.get('email', '') }}">

    <label for="hire_date">Hire date</label>
    <input type="date" name="hire_date" id="hire_date" required value="{{ form.get('hire_date', today) }}">

    <button type="submit">Add employee</button>
  </form>
</body>
</html>
